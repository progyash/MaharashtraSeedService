version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mss-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mss-network
    environment:
      MONGO_INITDB_DATABASE: maharashtra-seed-service

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mss-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - mss-network
    environment:
      - MONGO_URI=mongodb://mongo:27017/maharashtra-seed-service
      - PORT=5000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mss-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mss-network
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api

volumes:
  mongo-data:

networks:
  mss-network:
    driver: bridge

